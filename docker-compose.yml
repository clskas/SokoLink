services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sokolink
      POSTGRES_PASSWORD: sokolink
      POSTGRES_DB: sokolink
    ports:
      - "5434:5432"
    volumes:
      - sokolink_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokolink -d sokolink"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sokolink:sokolink@db:5432/sokolink?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-sokolink-prod-access-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-sokolink-prod-refresh-change-me}
      JWT_ACCESS_EXPIRES: 90d
      JWT_REFRESH_EXPIRES: 365d
      PORT: "3100"
      APP_NAME: SokoLink
      OTP_DEV_EXPOSE: "true"
    ports:
      - "3190:3100"
    volumes:
      - sokolink_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:3100/v1
      ADMIN_PORT: "3200"
    ports:
      - "3200:3200"

volumes:
  sokolink_pg:
  sokolink_uploads:
