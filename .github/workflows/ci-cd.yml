name: SokoLink CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality-api:
    name: Quality API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sokolink
          POSTGRES_PASSWORD: sokolink
          POSTGRES_DB: sokolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokolink -d sokolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sokolink:sokolink@localhost:5432/sokolink?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - name: Security npm audit
        run: npm audit --audit-level=high || true
      - run: npm run build
      - name: Unit tests
        run: npm test -- --ci
      - name: Regression e2e
        run: npm run test:e2e -- --runInBand

  quality-admin:
    name: Quality Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Security npm audit
        run: npm audit --audit-level=high || true
      - run: npm run build

  quality-mobile:
    name: Quality Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  docker-smoke:
    name: Smoke Docker Compose
    runs-on: ubuntu-latest
    needs: [quality-api, quality-admin, quality-mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Build stack
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for API
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/v1/health; then
              echo "API healthy after ${i} attempts"
              exit 0
            fi
            echo "attempt $i — waiting..."
            docker compose ps || true
            sleep 3
          done
          echo "===== API LOGS ====="
          docker compose logs api --no-color || true
          echo "===== DB LOGS ====="
          docker compose logs db --no-color || true
          exit 1
      - name: Smoke tests
        run: |
          chmod +x scripts/smoke.sh
          SMOKE_BASE_URL=http://127.0.0.1:3100/v1 ./scripts/smoke.sh
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy images
    runs-on: ubuntu-latest
    needs: [docker-smoke]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sokolink-api:latest
            ghcr.io/${{ github.repository_owner }}/sokolink-api:${{ github.sha }}
      - name: Push Admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sokolink-admin:latest
            ghcr.io/${{ github.repository_owner }}/sokolink-admin:${{ github.sha }}
      - name: Production smoke
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "No PRODUCTION_API_URL — skip production smoke"
            exit 0
          fi
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh
      - name: Deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "No DEPLOY_WEBHOOK_URL — skip webhook"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${{ github.sha }}\",\"repo\":\"${{ github.repository }}\"}"
